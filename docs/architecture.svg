<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#a78bfa"/></marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.5,3 L0,6 Z" fill="#60a5fa"/></marker>
  </defs>

  <rect x="0" y="0" width="1120" height="650" fill="#ffffff"/>
  <text x="40" y="46" fill="#0f172a" font-size="23" font-weight="600">InsightDocs — Agentic RAG Architecture</text>
  <text x="40" y="69" fill="#64748b" font-size="13">Hybrid retrieval · cross-encoder reranking · query routing &amp; decomposition · cited, streamed answers</text>

  <!-- INGESTION panel -->
  <rect x="28" y="86" width="1064" height="98" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="108" fill="#2563eb" font-size="11" font-weight="700" letter-spacing="1.2">INGESTION · OFFLINE</text>
  <g font-size="13" text-anchor="middle">
    <rect x="46"  y="120" width="118" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="105" y="149" fill="#334155">PDF document</text>
    <rect x="196" y="120" width="118" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="255" y="143" fill="#334155">Load &amp;</text><text x="255" y="159" fill="#334155">clean</text>
    <rect x="346" y="120" width="118" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="405" y="143" fill="#334155">Chunk</text><text x="405" y="159" fill="#64748b" font-size="11">(overlap)</text>
    <rect x="496" y="120" width="118" height="48" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="555" y="143" fill="#334155">Embed</text><text x="555" y="159" fill="#64748b" font-size="11">MiniLM</text>
    <rect x="648" y="118" width="160" height="52" rx="9" fill="#eff6ff" stroke="#3b82f6"/><text x="728" y="140" fill="#1e40af" font-weight="600">Qdrant</text><text x="728" y="157" fill="#1d4ed8" font-size="10.5">vector store · per-doc metadata</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M164,144 L194,144"/><path d="M314,144 L344,144"/><path d="M464,144 L494,144"/><path d="M614,144 L646,144"/>
  </g>

  <!-- QUERY panel -->
  <rect x="28" y="204" width="1064" height="418" rx="14" fill="#fafaff" stroke="#ececfb"/>
  <text x="46" y="228" fill="#7c3aed" font-size="11" font-weight="700" letter-spacing="1.2">QUERY-TIME · AGENTIC</text>

  <g font-size="13" text-anchor="middle">
    <rect x="46"  y="242" width="130" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="111" y="272" fill="#334155">User question</text>
    <rect x="212" y="242" width="126" height="50" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/><text x="275" y="266" fill="#6d28d9" font-weight="600">Router</text><text x="275" y="283" fill="#7c3aed" font-size="10.5">retrieve / direct</text>
    <rect x="384" y="238" width="212" height="42" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="490" y="264" fill="#64748b" font-size="12">Direct answer (greeting / meta)</text>
    <rect x="384" y="300" width="236" height="50" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/><text x="502" y="322" fill="#6d28d9" font-weight="600">Decompose</text><text x="502" y="339" fill="#7c3aed" font-size="10.5">complex Q → sub-questions</text>
  </g>
  <path d="M176,267 L210,267" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M338,261 L382,260" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
  <path d="M275,292 L275,325 L382,325" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>

  <!-- Hybrid retrieval -->
  <rect x="46" y="386" width="1028" height="96" rx="11" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="62" y="408" fill="#2563eb" font-size="10.5" font-weight="700" letter-spacing="1">HYBRID RETRIEVAL</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="64"  y="420" width="182" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="155" y="441" fill="#1e40af">Dense search</text><text x="155" y="457" fill="#2563eb" font-size="10.5">Qdrant · cosine</text>
    <text x="258" y="449" fill="#2563eb" font-size="18" font-weight="700" text-anchor="middle">+</text>
    <rect x="272" y="420" width="164" height="48" rx="8" fill="#eff6ff" stroke="#60a5fa"/><text x="354" y="441" fill="#1e40af">BM25</text><text x="354" y="457" fill="#2563eb" font-size="10.5">keyword</text>
    <rect x="470" y="420" width="150" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="545" y="441" fill="#334155">RRF fusion</text><text x="545" y="457" fill="#64748b" font-size="10.5">reciprocal rank</text>
    <rect x="654" y="420" width="196" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="752" y="441" fill="#334155">Cross-encoder</text><text x="752" y="457" fill="#64748b" font-size="10.5">rerank</text>
    <rect x="884" y="420" width="172" height="48" rx="8" fill="#ecfdf5" stroke="#34d399"/><text x="970" y="447" fill="#047857">Top-k context</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M436,444 L468,444"/><path d="M620,444 L652,444"/><path d="M850,444 L882,444"/>
  </g>
  <path d="M502,350 L502,384" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#ap)"/>
  <path d="M728,170 C728,300 155,300 155,418" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#ab)"/>
  <text x="250" y="300" fill="#94a3b8" font-size="10.5">indexed vectors</text>

  <!-- Generation -->
  <g font-size="13" text-anchor="middle">
    <rect x="46"  y="540" width="236" height="54" rx="9" fill="#ffffff" stroke="#cbd5e1"/><text x="164" y="564" fill="#334155">Prompt</text><text x="164" y="581" fill="#64748b" font-size="10.5">context + chat history</text>
    <rect x="330" y="540" width="290" height="54" rx="9" fill="#eff6ff" stroke="#3b82f6"/><text x="475" y="564" fill="#1e40af" font-weight="600">LLM</text><text x="475" y="581" fill="#2563eb" font-size="10.5">Ollama · OpenAI · Anthropic</text>
    <rect x="668" y="540" width="252" height="54" rx="9" fill="#ecfdf5" stroke="#34d399"/><text x="794" y="564" fill="#047857" font-weight="600">Cited, streamed answer</text><text x="794" y="581" fill="#059669" font-size="10.5">[Source n] · SSE tokens</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M970,468 L970,512 L164,512 L164,538"/><path d="M282,567 L328,567"/><path d="M620,567 L666,567"/>
  </g>
  <path d="M596,260 C860,260 794,430 794,538" stroke="#a78bfa" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#ap)"/>
</svg>
