services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: insightdocs-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: insightdocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["ollama"]   # only starts when you run: docker compose --profile ollama up

  api:
    build: .
    container_name: insightdocs-api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: insightdocs

volumes:
  qdrant_data:
  ollama_data:
