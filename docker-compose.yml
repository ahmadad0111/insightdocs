services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: insightdocs-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: insightdocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["ollama"]   # starts only with: docker compose --profile ollama up

  api:
    build: .
    container_name: insightdocs-api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    env_file:
      - path: .env
        required: false       # works without a .env; inline vars + code defaults apply
    volumes:
      - ./data:/app/data      # host PDFs visible to the container for --ingest
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      COLLECTION_NAME: insightdocs
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: llama3
    # give the model-loading container enough headroom (raise if it gets OOM-killed)
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  qdrant_data:
  ollama_data:
