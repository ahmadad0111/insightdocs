<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InsightDocs — RAG Assistant</title>
<style>
  :root{
    --bg:#0b1120; --panel:#111a2e; --panel-2:#0f1728; --border:#1e2b45;
    --text:#e8eefc; --muted:#8b9ac0; --accent:#5b8cff; --accent-2:#7c5cff;
    --user:#1b2e4d; --ok:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 22px;border-bottom:1px solid var(--border);background:var(--panel-2)}
  header .brand{font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
  header .brand span{color:var(--accent)}
  .status{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
  .layout{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  aside{border-right:1px solid var(--border);background:var(--panel-2);
    padding:18px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
  aside h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;
    color:var(--muted);margin:0 0 8px}
  .upload{border:1.5px dashed var(--border);border-radius:12px;padding:18px;
    text-align:center;cursor:pointer;transition:.2s;font-size:.85rem;color:var(--muted)}
  .upload:hover{border-color:var(--accent);color:var(--text)}
  .doc{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 11px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;
    background:var(--panel);font-size:.82rem}
  .doc .meta{overflow:hidden}
  .doc .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc .sub{color:var(--muted);font-size:.72rem}
  .doc button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
  .doc button:hover{color:var(--danger)}
  .reset{margin-top:auto;font-size:.75rem;color:var(--muted);background:none;
    border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer}
  .reset:hover{border-color:var(--danger);color:var(--danger)}
  main{display:flex;flex-direction:column;min-height:0}
  #messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px}
  .msg{max-width:760px;line-height:1.6}
  .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#fff;padding:11px 15px;border-radius:16px 16px 4px 16px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);
    padding:14px 16px;border-radius:16px 16px 16px 4px;white-space:pre-wrap}
  .sources{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.72rem;background:var(--panel-2);border:1px solid var(--border);
    color:var(--muted);padding:4px 9px;border-radius:999px;cursor:default}
  .chip b{color:var(--accent)}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
  .empty h1{font-size:1.5rem;color:var(--text);margin-bottom:8px}
  .agentnote{align-self:flex-start;font-size:.74rem;color:var(--muted);
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:6px 11px;max-width:760px}
  .agentnote b{color:var(--accent-2)}
  form{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border);
    background:var(--panel-2)}
  #q{flex:1;background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:12px;padding:13px 15px;font-size:.95rem;outline:none}
  #q:focus{border-color:var(--accent)}
  button.send{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    border:none;border-radius:12px;padding:0 22px;font-weight:700;cursor:pointer}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    padding:10px 16px;border-radius:10px;font-size:.85rem;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand">Insight<span>Docs</span> — RAG Assistant</div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
</header>

<div class="layout">
  <aside>
    <div>
      <h2>Documents</h2>
      <label class="upload" id="uploadBox">
        <input type="file" accept="application/pdf" id="fileInput" hidden multiple />
        + Upload PDF<br /><small>click or drop files</small>
      </label>
    </div>
    <div id="docList"></div>
    <button class="reset" id="resetBtn">Reset knowledge base</button>
  </aside>

  <main>
    <div id="messages">
      <div class="empty" id="emptyState">
        <h1>Ask your documents</h1>
        <p>Upload a PDF, then ask a question. Answers stream in with inline source citations.</p>
      </div>
    </div>
    <form id="chatForm">
      <input id="q" placeholder="Ask a question about your documents…" autocomplete="off" />
      <button class="send" id="sendBtn" type="submit">Send</button>
    </form>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const API = (location.port === "8000" || location.protocol === "file:")
  ? "http://localhost:8000" : "";
const $ = s => document.querySelector(s);
const messages = $("#messages");

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500); }

async function checkHealth(){
  try{ const r = await fetch(API+"/health"); if(r.ok){
      $("#statusDot").classList.add("ok"); $("#statusText").textContent="connected"; }
  }catch(e){ $("#statusText").textContent="API offline"; }
}

async function loadDocs(){
  try{
    const r = await fetch(API+"/documents"); const data = await r.json();
    const list = $("#docList"); list.innerHTML = "";
    (data.documents||[]).forEach(d=>{
      const el = document.createElement("div"); el.className="doc";
      el.innerHTML = `<div class="meta"><div class="name">${d.filename||d.document_id}</div>
        <div class="sub">${d.num_chunks} chunks</div></div>
        <button title="Delete" data-id="${d.document_id}">&times;</button>`;
      el.querySelector("button").onclick = ()=>deleteDoc(d.document_id);
      list.appendChild(el);
    });
  }catch(e){}
}

async function deleteDoc(id){
  await fetch(API+"/documents/"+id,{method:"DELETE"});
  toast("Document removed"); loadDocs();
}

$("#resetBtn").onclick = async ()=>{
  if(!confirm("Delete ALL indexed documents?")) return;
  await fetch(API+"/documents",{method:"DELETE"}); toast("Knowledge base reset"); loadDocs();
};

const fileInput = $("#fileInput");
$("#uploadBox").onclick = ()=>fileInput.click();
fileInput.onchange = ()=>uploadFiles(fileInput.files);
const box = $("#uploadBox");
["dragover","dragenter"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.style.borderColor="var(--accent)";}));
["dragleave","drop"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();box.style.borderColor="";}));
box.addEventListener("drop",e=>uploadFiles(e.dataTransfer.files));

async function uploadFiles(files){
  for(const f of files){
    if(!f.name.toLowerCase().endsWith(".pdf")){ toast("PDF only"); continue; }
    toast("Indexing "+f.name+"…");
    const fd = new FormData(); fd.append("file", f);
    try{
      const r = await fetch(API+"/documents",{method:"POST",body:fd});
      const d = await r.json();
      if(r.ok) toast(`Indexed ${d.filename} (${d.num_chunks} chunks)`);
      else toast("Error: "+(d.detail||"ingest failed"));
    }catch(e){ toast("Upload failed — is the API running?"); }
  }
  loadDocs();
}

function addMsg(cls, text){
  const empty=$("#emptyState"); if(empty) empty.remove();
  const el=document.createElement("div"); el.className="msg "+cls; el.textContent=text;
  messages.appendChild(el); messages.scrollTop=messages.scrollHeight; return el;
}

function renderSources(el, sources){
  if(!sources || !sources.length) return;
  const wrap=document.createElement("div"); wrap.className="sources";
  sources.forEach((s,i)=>{
    const chip=document.createElement("span"); chip.className="chip";
    chip.title=s.text||"";
    chip.innerHTML=`<b>[${i+1}]</b> ${s.filename?s.filename+" · ":""}p.${s.page??"?"}`;
    wrap.appendChild(chip);
  });
  el.appendChild(wrap); messages.scrollTop=messages.scrollHeight;
}

$("#chatForm").onsubmit = async (e)=>{
  e.preventDefault();
  const q=$("#q").value.trim(); if(!q) return;
  $("#q").value=""; $("#sendBtn").disabled=true;
  addMsg("user", q);
  const bot=addMsg("bot",""); let answer="";
  try{
    const r=await fetch(API+"/stream",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q})});
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n"); buf=parts.pop();
      for(const p of parts){
        const line=p.replace(/^data:\s*/,""); if(!line) continue;
        let data; try{ data=JSON.parse(line);}catch(_){continue;}
        if(data.token){ answer+=data.token; bot.textContent=answer;
          messages.scrollTop=messages.scrollHeight; }
        if(data.route && data.sub_questions && data.sub_questions.length && !data.done){
          const note=document.createElement('div'); note.className='agentnote';
          note.innerHTML='<b>Agent</b> split this into: '+data.sub_questions.map(q=>'"'+q+'"').join(', ');
          messages.insertBefore(note, bot);
        }
        if(data.done){ renderSources(bot, data.sources); }
      }
    }
    if(!answer) bot.textContent="(no response — check the API/LLM)";
  }catch(err){ bot.textContent="Error: could not reach the API. Is it running on :8000?"; }
  $("#sendBtn").disabled=false; $("#q").focus();
};

checkHealth(); loadDocs(); setInterval(checkHealth, 15000);
</script>
</body>
</html>
