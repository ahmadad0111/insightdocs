<!DOCTYPE html>
<html>
<head>
    <title>RAG Streaming Demo</title>
</head>
<body>

<h2>RAG Streaming System</h2>

<input id="q" placeholder="Ask something..." />
<button onclick="ask()">Ask</button>

<pre id="output"></pre>

<script>
    function ask() {
        const query = document.getElementById("q").value;
        const output = document.getElementById("output");
        output.innerText = "";
    
        fetch("http://127.0.0.1:8000/stream", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ query: query })
        }).then(async response => {
    
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
    
            let buffer = "";
    
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
    
                buffer += decoder.decode(value, { stream: true });
    
                let lines = buffer.split("\n");
                buffer = lines.pop(); // keep incomplete line
    
                for (let line of lines) {
    
                    if (line.startsWith("data: ")) {
    
                        try {
                            const data = JSON.parse(line.replace("data: ", ""));
    
                            if (data.token) {
                                output.innerText += data.token;
                            }
    
                            if (data.done) {
                                output.innerText += "\n\nSources:\n" +
                                    JSON.stringify(data.sources, null, 2);
                            }
    
                        } catch (e) {
                            console.log("Parse error:", line);
                        }
                    }
                }
            }
        });
    }
    </script>

</body>
</html>
